services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: procure
      POSTGRES_PASSWORD: procure
      POSTGRES_DB: procure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procure -d procure"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  sample:
    build:
      context: .
      target: sample
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9090/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    environment:
      DATABASE_URL: postgres://procure:procure@db:5432/procure?sslmode=disable
      SAMPLE_BASE_URL: http://sample:9090
      FRONTEND_DIST: /app/frontend/dist
      HTTP_ADDR: ":8080"
      WORKER_ID: worker-1
      LEASE_DURATION: 90s
      POLL_INTERVAL: 2s
      REVIEW_INTERVAL: 24h
      REVIEW_RECENT_WINDOW: 72h
    depends_on:
      db:
        condition: service_healthy
      sample:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  pgdata:
